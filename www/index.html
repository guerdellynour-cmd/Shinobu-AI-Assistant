<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINOBU</title>
    <link rel="shortcut icon" href="assets/img/shinobu.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="assets/vendore/texllate/animate.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section id="Oval" class="mb-4">
            <div class="row">
                <div class="col-md-1"></div>
                <div class="col-md-10">
                    <div id="loader-wrapper">
                        <div id="loader">
                            <div id="loader1">
                            </div>
                        </div>
                        <p>SHINOBU</p>
                    </div>
                    <h5 class="text text-center">Ask me anything</h5>
                    <!-- /****************************Input Box******************************/ -->

                    <div class="col-md-12 mt-4 pt-4">
                        <div class="text-center">
                            <div id="textInput" class="d-flex">
                                <input type="text" class="input-field" name="chatbox" id="chatbox"
                                    placeholder="Type here ... ">
                                <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
                                <button id="ChatBtn" class="glow-on-hover" data-bs-toggle="offcanvas"
                                    data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling">
                                    <i class="bi bi-chat-dots"></i></button>
                                <button id="SettingsBtn" class="glow-on-hover"><i class="bi bi-gear"></i></button>
                            </div>
                        </div>
                    </div>
                    <!-- /****************************Input Box End******************************/ -->
                </div>
                <div class="col-md-1"></div>
            </div>
        </section>

        <section id="SiriWave" class="mb-4" hidden>
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
                            <div>
                                <h5 class="text-center mb-4 siri-message" style="font-size: 26px;">Hello, I am S.H.I.N.O.B.U</h5>
                                <div id="siri-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Chat history panel (opened by the existing ChatBtn) -->
        <div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="offcanvasScrolling"
            aria-labelledby="offcanvasScrollingLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasScrollingLabel">Conversation</h5>
                <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas"
                    aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div id="chat-log"></div>
                <p class="chat-hint">Type in the box below and press Enter, or use the mic — replies show up here
                    too.</p>
            </div>
        </div>

        <!-- Settings panel (opened from main.js when SettingsBtn is clicked) -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSettings"
            aria-labelledby="offcanvasSettingsLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasSettingsLabel">Settings</h5>
                <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas"
                    aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">

                <div class="settings-section">
                    <h6>Assistant</h6>
                    <label class="settings-field">Name
                        <input type="text" id="setting-name" class="input-field-box">
                    </label>
                    <label class="settings-field">Voice
                        <select id="setting-voice" class="input-field-box"></select>
                    </label>
                    <label class="settings-field">Speech rate <span id="rate-value">190</span>
                        <input type="range" id="setting-rate" min="120" max="260" step="10">
                    </label>
                    <button id="save-settings-btn" class="glow-on-hover settings-btn">Save</button>
                    <span id="settings-status"></span>
                </div>

                <hr>

                <div class="settings-section">
                    <h6>App shortcuts</h6>
                    <p class="settings-hint">Say "open [name]" to launch these apps.</p>
                    <ul id="app-shortcut-list" class="shortcut-list"></ul>
                    <div class="shortcut-form">
                        <input id="app-name" class="input-field-box" placeholder="Name">
                        <input id="app-path" class="input-field-box" placeholder="Path to .exe">
                        <button id="add-app-shortcut-btn" class="glow-on-hover settings-btn">Add</button>
                    </div>
                </div>

                <hr>

                <div class="settings-section">
                    <h6>Website shortcuts</h6>
                    <p class="settings-hint">Say "open [name]" to launch these sites.</p>
                    <ul id="web-shortcut-list" class="shortcut-list"></ul>
                    <div class="shortcut-form">
                        <input id="web-name" class="input-field-box" placeholder="Name">
                        <input id="web-url" class="input-field-box" placeholder="https://...">
                        <button id="add-web-shortcut-btn" class="glow-on-hover settings-btn">Add</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!--Jquery  -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="main.js"></script>

    <!-- Texllate js -->
    <script src="assets/vendore/texllate/jquery.fittext.js"></script>
    <script src="assets/vendore/texllate/jquery.lettering.js"></script>
    <script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>
    <script type="text/javascript" src="/eel.js"></script>

    <!-- Siri wave link -->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
    <script src="./controller.js"></script>
</body>
</html>
